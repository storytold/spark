name: Spark CI Linux
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    name: spark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x']
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Use Node.js ${{ matrix['node-version'] }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix['node-version'] }}

      - name: Checkout Repo
        uses: actions/checkout@v4.4.0

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test